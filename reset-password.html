<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restablecer contraseña – Fajas Colombianas Maydel</title>
  <meta name="description" content="Define tu nueva contraseña.">
  <link rel="icon" type="image/jpeg" href="assets/logo.jpeg">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

<div class="login-page">
  <div class="login-box" style="animation:fadeUp .6s ease both;max-width:440px">
    <div class="login-header">
      <img src="assets/logo.jpeg" alt="Fajas Colombianas Maydel">
      <h1>Nueva contraseña</h1>
      <p>Crea una nueva contraseña para tu cuenta</p>
    </div>

    <div class="login-body">
      <div id="invalidBox" style="display:none;background:#fef2f2;border-left:3px solid #dc2626;padding:14px;border-radius:8px;color:#991b1b;font-size:14px;margin-bottom:14px">
        <i class="fa-solid fa-circle-exclamation"></i>
        El enlace es inválido o ya expiró. Solicita uno nuevo.
        <div style="margin-top:12px"><a href="forgot-password.html" style="color:#991b1b;font-weight:700">Pedir otro enlace</a></div>
      </div>

      <form id="resetForm" onsubmit="handleReset(event)" style="display:none">
        <div class="form-field">
          <label>Nueva contraseña</label>
          <div class="input-icon">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="password" class="has-toggle" placeholder="Mín. 6 caracteres" required minlength="6" autocomplete="new-password">
            <button type="button" class="pw-toggle" aria-label="Mostrar contraseña" onclick="togglePw(this,'password')"><i class="fa-solid fa-eye"></i></button>
          </div>
        </div>
        <div class="form-field">
          <label>Confirmar contraseña</label>
          <div class="input-icon">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="password2" class="has-toggle" placeholder="Repite la contraseña" required minlength="6" autocomplete="new-password">
            <button type="button" class="pw-toggle" aria-label="Mostrar contraseña" onclick="togglePw(this,'password2')"><i class="fa-solid fa-eye"></i></button>
          </div>
        </div>

        <div class="form-error" id="resetError" style="display:none">
          <i class="fa-solid fa-circle-exclamation"></i>
          <span id="resetErrorMsg"></span>
        </div>
        <div id="resetSuccess" style="display:none;background:#eaf5ee;border-left:3px solid #1a5c2e;padding:14px;border-radius:8px;color:#0d3d1a;font-size:14px;margin-bottom:14px">
          <i class="fa-solid fa-circle-check"></i> Tu contraseña fue actualizada. Te redirigimos a iniciar sesión...
        </div>

        <button type="submit" class="login-btn" id="resetSubmit">
          <i class="fa-solid fa-key"></i> Guardar contraseña
        </button>

        <div style="text-align:center;margin-top:18px">
          <a href="login.html" style="color:var(--gray-500);font-size:13px">
            <i class="fa-solid fa-arrow-left"></i> Volver a iniciar sesión
          </a>
        </div>
      </form>
    </div>
  </div>
</div>

<script>
function togglePw(btn, inputId) {
  const input = document.getElementById(inputId);
  const icon  = btn.querySelector('i');
  const show  = input.type === 'password';
  input.type  = show ? 'text' : 'password';
  icon.className = show ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye';
  btn.setAttribute('aria-label', show ? 'Ocultar contraseña' : 'Mostrar contraseña');
}

const TOKEN = new URLSearchParams(location.search).get('token') || '';

(async function init() {
  if (!TOKEN) { document.getElementById('invalidBox').style.display = 'block'; return; }
  try {
    const r = await fetch('/api/auth/reset-password/validate?token=' + encodeURIComponent(TOKEN));
    const data = await r.json();
    if (data.valid) document.getElementById('resetForm').style.display = 'block';
    else document.getElementById('invalidBox').style.display = 'block';
  } catch {
    document.getElementById('invalidBox').style.display = 'block';
  }
})();

async function handleReset(e) {
  e.preventDefault();
  const p1 = document.getElementById('password').value;
  const p2 = document.getElementById('password2').value;
  const errBox = document.getElementById('resetError');
  const okBox  = document.getElementById('resetSuccess');
  const btn    = document.getElementById('resetSubmit');
  errBox.style.display = 'none'; okBox.style.display = 'none';
  if (p1 !== p2) {
    errBox.style.display = 'flex';
    document.getElementById('resetErrorMsg').textContent = 'Las contraseñas no coinciden';
    return;
  }
  btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Guardando...';
  try {
    const r = await fetch('/api/auth/reset-password', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: TOKEN, password: p1 }),
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Error');
    okBox.style.display = 'block';
    setTimeout(() => { location.href = 'login.html'; }, 2000);
  } catch (err) {
    errBox.style.display = 'flex';
    document.getElementById('resetErrorMsg').textContent = err.message;
  } finally {
    btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-key"></i> Guardar contraseña';
  }
}
</script>
</body>
</html>
