<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página no encontrada – Fajas Colombianas Maydel</title>
  <meta name="description" content="La página que buscas no existe. Vuelve al inicio de Fajas Colombianas Maydel.">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/jpeg" href="/assets/logo.jpeg">
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    .err-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#071a0c,#1a5c2e);color:#fff;padding:40px 20px;text-align:center}
    .err-box{max-width:520px}
    .err-code{font-family:'Playfair Display',serif;font-size:clamp(100px,18vw,180px);font-weight:900;color:#c9a96e;line-height:1;letter-spacing:-3px;margin-bottom:8px;text-shadow:0 4px 24px rgba(0,0,0,.4)}
    .err-title{font-family:'Playfair Display',serif;font-size:clamp(24px,4vw,34px);font-weight:700;margin-bottom:14px}
    .err-text{font-size:15px;opacity:.7;line-height:1.7;margin-bottom:32px;font-weight:300}
    .err-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
    .err-btn{display:inline-flex;align-items:center;gap:8px;padding:14px 26px;border-radius:2px;font-size:13px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;text-decoration:none;transition:all .2s;font-family:'DM Sans',sans-serif}
    .err-btn.primary{background:#c9a96e;color:#071a0c;box-shadow:0 8px 24px rgba(201,169,110,.3)}
    .err-btn.primary:hover{background:#b8934e;transform:translateY(-2px)}
    .err-btn.outline{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.4)}
    .err-btn.outline:hover{background:rgba(255,255,255,.1)}
    .err-logo{width:80px;height:80px;border-radius:50%;object-fit:cover;margin:0 auto 24px;box-shadow:0 4px 20px rgba(0,0,0,.5)}
  </style>
</head>
<body>
  <div class="err-wrap">
    <div class="err-box">
      <img src="/assets/logo.jpeg" alt="Maydel" class="err-logo">
      <div class="err-code">404</div>
      <h1 class="err-title">Esta página se nos escapó</h1>
      <p class="err-text">La dirección que buscas no existe o se cambió de lugar. Pero nuestras fajas siguen aquí esperándote.</p>
      <div class="err-actions">
        <a href="/" class="err-btn primary"><i class="fa-solid fa-house"></i> Ir al inicio</a>
        <a href="/tienda.html" class="err-btn outline"><i class="fa-solid fa-store"></i> Ver productos</a>
      </div>
    </div>
  </div>
</body>
</html>
