<!DOCTYPE html>
<html lang="es">
<head>
  <!-- Google tag (GTM-MHHLXV5M): Google Ads y medición de conversiones -->
  <script async src="https://www.googletagmanager.com/gtm.js?id=GTM-MHHLXV5M"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis pedidos – Fajas Maydel</title>
  <meta name="description" content="Consulta el estado de tus pedidos en Fajas Maydel.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#1a5c2e">
  <link rel="icon" type="image/jpeg" href="/assets/logo.jpeg">
  <link rel="apple-touch-icon" href="/assets/logo.jpeg">
  <script src="/config.js"></script>
  <script src="/js/analytics.js" defer></script>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/mis-pedidos.css">
</head>
<body>

<header>
  <div class="header-top">
    <a href="index.html" class="logo-link">
      <img src="assets/logo.jpeg" alt="Fajas Colombianas Maydel">
    </a>
    <form class="search-bar">
      <input type="text" placeholder="Buscar fajas, tallas, categorías...">
      <button type="submit"><i class="fa-solid fa-magnifying-glass"></i></button>
    </form>
    <div class="header-right">
      <a href="carrito.html" class="header-icon-btn">
        <i class="fa-solid fa-cart-shopping"></i>
        <span class="cart-badge-count">0</span>
        <span>Carrito</span>
      </a>
      <div id="authArea"></div>
    </div>
  </div>
  <nav class="nav-bar">
    <ul>
      <li><a href="index.html"><i class="fa-solid fa-house"></i> Inicio</a></li>
      <li><a href="tienda.html"><i class="fa-solid fa-store"></i> Productos</a></li>
      <li><a href="nosotros.html"><i class="fa-solid fa-circle-info"></i> Sobre nosotros</a></li>
      <li><a href="faq.html"><i class="fa-solid fa-circle-question"></i> Preguntas frecuentes</a></li>
    </ul>
  </nav>
</header>

<main class="orders-page">
  <div class="orders-wrap">
    <h1 class="orders-title">Mis pedidos</h1>
    <p class="orders-sub">Aquí puedes ver el historial y estado actual de tus pedidos.</p>
    <div id="ordersList"><div class="empty-orders"><i class="fa-solid fa-spinner fa-spin"></i><h3>Cargando...</h3></div></div>
  </div>
</main>

<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script src="js/main.js"></script>
<script>
const STEPS = [
  { key:'pending',    label:'Recibido',   icon:'fa-clipboard-check' },
  { key:'confirmed',  label:'Confirmado', icon:'fa-circle-check' },
  { key:'processing', label:'Preparando', icon:'fa-box' },
  { key:'shipped',    label:'En camino',  icon:'fa-truck' },
  { key:'delivered',  label:'Entregado',  icon:'fa-flag-checkered' },
];
const STATUS_LABEL = { pending:'Pendiente', confirmed:'Confirmado', processing:'En preparación', shipped:'Enviado', delivered:'Entregado', cancelled:'Cancelado' };

document.addEventListener('DOMContentLoaded', async () => {
  await AUTH.init();
  const session = AUTH.getSession();
  if (!session) { location.href = 'login.html?redirect=mis-pedidos'; return; }
  try {
    const r = await fetch('/api/orders', { credentials: 'include' });
    const orders = await r.json();
    renderOrders(orders);
  } catch (e) {
    document.getElementById('ordersList').innerHTML = '<div class="empty-orders"><i class="fa-solid fa-circle-exclamation"></i><h3>No pudimos cargar tus pedidos</h3></div>';
  }
});

function renderOrders(orders) {
  const list = document.getElementById('ordersList');
  // Un pago con tarjeta que nunca se completó no es un pedido real: no se muestra.
  orders = orders.filter(o => !(o.paymentMethod === 'stripe' && o.status === 'cancelled' && !['paid', 'refunded'].includes(o.paymentStatus)));
  if (!orders.length) {
    list.innerHTML = `<div class="empty-orders">
      <i class="fa-solid fa-clipboard-list"></i>
      <h3>Aún no tienes pedidos</h3>
      <p style="color:#9ca3af;margin:10px 0 22px">Cuando hagas una compra, podrás darle seguimiento aquí.</p>
      <a href="tienda.html" class="btn btn-primary"><i class="fa-solid fa-store"></i> Ver productos</a>
    </div>`;
    return;
  }
  list.innerHTML = orders.map(o => {
    const idx = STEPS.findIndex(s => s.key === o.status);
    const cancelled = o.status === 'cancelled';
    const timeline = cancelled
      ? `<div class="timeline" style="justify-content:center"><div class="timeline-step cancelled"><div class="timeline-dot"><i class="fa-solid fa-circle-xmark"></i></div><div class="timeline-label">Pedido cancelado</div></div></div>`
      : `<div class="timeline">${STEPS.map((s,i) => {
          const cls = i < idx ? 'done' : i === idx ? 'current' : '';
          return `<div class="timeline-step ${cls}">
            <div class="timeline-dot"><i class="fa-solid ${s.icon}"></i></div>
            <div class="timeline-label">${s.label}</div>
          </div>`;
        }).join('')}</div>`;
    const items = (o.items || []).map(it => `<div class="order-item-row"><span>${esc(it.productName)}${it.size?` (${esc(it.size)})`:''} x${it.qty}</span><span>${formatPrice(it.price*it.qty)}</span></div>`).join('');
    return `<div class="order-card">
      <div class="order-head">
        <div>
          <div class="order-id">Pedido #${o.id}</div>
          <div class="order-date">${new Date(o.createdAt).toLocaleString('es-MX',{dateStyle:'medium',timeStyle:'short'})}</div>
        </div>
        <div style="text-align:right">
          <span class="badge-status ${o.status}">${STATUS_LABEL[o.status]||o.status}</span>
          <div class="order-total" style="margin-top:6px">${formatPrice(o.total)}</div>
        </div>
      </div>
      <div class="order-body">
        ${o.delayed && !cancelled ? `<div style="background:#fef3c7;border:1px solid #fde68a;color:#92400e;border-radius:8px;padding:12px 14px;margin-bottom:16px;font-size:14px">
          <strong><i class="fa-solid fa-triangle-exclamation"></i> Tu pedido viene con retraso.</strong>
          ${o.delayNote ? `<div style="margin-top:4px">${esc(o.delayNote)}</div>` : ''}
        </div>` : ''}
        ${o.paymentMethod === 'stripe' && o.paymentStatus !== 'paid' && o.paymentStatus !== 'refunded' && !cancelled ? `<div style="background:#f3f4f6;border-radius:8px;padding:12px 14px;margin-bottom:16px;font-size:14px;color:#374151">
          <i class="fa-solid fa-credit-card"></i> Pago con tarjeta pendiente. Si no se completa, el pedido se cancela solo y no se te cobra nada.
        </div>` : ''}
        ${o.paymentStatus === 'refunded' ? `<div style="background:#ede9fe;border-radius:8px;padding:12px 14px;margin-bottom:16px;font-size:14px;color:#5b21b6">
          <i class="fa-solid fa-rotate-left"></i> Te reembolsamos ${formatPrice(o.total)} a tu tarjeta (puede tardar de 5 a 10 días hábiles en reflejarse).
        </div>` : ''}
        ${o.trackingNumber && !cancelled ? `<div style="background:#eaf5ee;border:1px solid #bbe5c8;border-radius:8px;padding:12px 14px;margin-bottom:16px;font-size:14px;color:#0d3d1a">
          <strong><i class="fa-solid fa-truck-fast"></i> ${esc(o.trackingCarrier || 'Paquetería')}</strong> · Guía:
          <span style="font-family:monospace;font-size:15px;user-select:all">${esc(o.trackingNumber)}</span>
        </div>` : ''}
        ${timeline}
        <div class="order-items">${items}</div>
        <div class="order-totals">
          <div class="order-totals-row"><span>Subtotal</span><span>${formatPrice(o.subtotal||0)}</span></div>
          ${o.discountAmount ? `<div class="order-totals-row"><span>Descuento${o.couponCode ? ' (' + esc(o.couponCode) + ')' : ''}</span><span>-${formatPrice(o.discountAmount)}</span></div>` : ''}
          <div class="order-totals-row"><span>Envío ${o.shippingState ? '('+esc(o.shippingState)+')' : ''}</span><span>${o.shippingCost ? formatPrice(o.shippingCost) : 'GRATIS'}</span></div>
          <div class="order-totals-row total"><span>Total</span><span>${formatPrice(o.total)}</span></div>
        </div>
      </div>
    </div>`;
  }).join('');
}
</script>
</body>
</html>
