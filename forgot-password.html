<!DOCTYPE html>
<html lang="es">
<head>
  <!-- Google tag (GTM-MHHLXV5M): Google Ads y medición de conversiones -->
  <script async src="https://www.googletagmanager.com/gtm.js?id=GTM-MHHLXV5M"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar contraseña – Fajas Colombianas Maydel</title>
  <meta name="description" content="Recupera el acceso a tu cuenta en Fajas Colombianas Maydel.">
  <link rel="icon" type="image/jpeg" href="assets/logo.jpeg">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/forgot-password.css">
</head>
<body>

<div class="login-page">
  <div class="login-box" style="animation:fadeUp .6s ease both;max-width:440px">
    <div class="login-header">
      <a href="index.html" aria-label="Ir al inicio"><img src="assets/logo.jpeg" alt="Fajas Colombianas Maydel"></a>
      <h1>¿Olvidaste tu contraseña?</h1>
      <p>Recupérala por correo o por mensaje</p>
    </div>

    <div class="login-body">
      <div class="login-tabs">
        <div class="login-tab active" id="tabEmail" onclick="switchMethod('email')">
          <i class="fa-solid fa-envelope"></i> Por correo
        </div>
        <div class="login-tab" id="tabPhone" onclick="switchMethod('phone')">
          <i class="fa-solid fa-comment-sms"></i> Por SMS/WhatsApp
        </div>
      </div>

      <!-- ============ METODO: CORREO ============ -->
      <form id="forgotForm" onsubmit="handleForgot(event)">
        <div class="form-field">
          <label>Correo electrónico</label>
          <div class="input-icon">
            <i class="fa-solid fa-envelope"></i>
            <input type="email" id="email" placeholder="tu@correo.com" autocomplete="email">
          </div>
        </div>

        <div class="form-error" id="forgotError" style="display:none">
          <i class="fa-solid fa-circle-exclamation"></i>
          <span id="forgotErrorMsg"></span>
        </div>
        <div id="forgotSuccess" style="display:none;background:#eaf5ee;border-left:3px solid #1a5c2e;padding:14px;border-radius:8px;color:#0d3d1a;font-size:15.5px;margin-bottom:14px"></div>

        <button type="submit" class="login-btn" id="forgotSubmit">
          <i class="fa-solid fa-paper-plane"></i> Enviar enlace
        </button>
      </form>

      <!-- ============ METODO: SMS / WHATSAPP ============ -->
      <div id="phoneFlow" style="display:none">

        <!-- Paso 1: telefono + canal -->
        <div id="stepPhone">
          <div class="channel-pick">
            <div class="channel-opt active" id="chSms" onclick="pickChannel('sms')">
              <i class="fa-solid fa-comment-sms"></i> SMS
            </div>
            <div class="channel-opt wa" id="chWa" onclick="pickChannel('whatsapp')">
              <i class="fa-brands fa-whatsapp"></i> WhatsApp
            </div>
          </div>
          <div class="form-field">
            <label>Teléfono de tu cuenta</label>
            <div class="input-icon">
              <i class="fa-solid fa-mobile-screen"></i>
              <input type="tel" id="phone" placeholder="614 123 4567" autocomplete="tel" inputmode="tel">
            </div>
            <small class="muted">Te enviaremos un código de 6 dígitos al número registrado.</small>
          </div>
          <button type="button" class="login-btn" id="sendOtpBtn" onclick="sendOtp()">
            <i class="fa-solid fa-paper-plane"></i> Enviar código
          </button>
        </div>

        <!-- Paso 2: ingresar codigo -->
        <div id="stepCode" style="display:none">
          <div id="demoBox" class="demo-box" style="display:none"></div>
          <p style="font-size:15.5px;color:var(--gray-600);text-align:center;margin-bottom:14px">
            Escribe el código de 6 dígitos que enviamos a <strong id="codeTarget"></strong>
          </p>
          <div class="otp-inputs" id="otpInputs">
            <input type="text" inputmode="numeric" maxlength="1" autocomplete="one-time-code">
            <input type="text" inputmode="numeric" maxlength="1">
            <input type="text" inputmode="numeric" maxlength="1">
            <input type="text" inputmode="numeric" maxlength="1">
            <input type="text" inputmode="numeric" maxlength="1">
            <input type="text" inputmode="numeric" maxlength="1">
          </div>
          <div style="text-align:center;margin:10px 0 4px">
            <button type="button" class="muted" style="background:none;border:none;cursor:pointer;text-decoration:underline" id="resendBtn" onclick="sendOtp(true)">Reenviar código</button>
          </div>
          <button type="button" class="login-btn" id="verifyBtn" onclick="verifyOtp()">
            <i class="fa-solid fa-circle-check"></i> Verificar código
          </button>
          <div style="text-align:center;margin-top:10px">
            <button type="button" class="muted" style="background:none;border:none;cursor:pointer" onclick="backToPhone()"><i class="fa-solid fa-arrow-left"></i> Cambiar número</button>
          </div>
        </div>

        <!-- Paso 3: nueva contrasena -->
        <div id="stepNewPw" style="display:none">
          <div class="form-field">
            <label>Nueva contraseña</label>
            <div class="input-icon">
              <i class="fa-solid fa-lock"></i>
              <input type="password" id="newPw" class="has-toggle" placeholder="Mín. 8 caracteres" minlength="8" autocomplete="new-password">
              <button type="button" class="pw-toggle" aria-label="Mostrar contraseña" onclick="togglePw(this,'newPw')"><i class="fa-solid fa-eye"></i></button>
            </div>
          </div>
          <div class="form-field">
            <label>Confirmar contraseña</label>
            <div class="input-icon">
              <i class="fa-solid fa-lock"></i>
              <input type="password" id="newPw2" class="has-toggle" placeholder="Repite la contraseña" minlength="8" autocomplete="new-password">
              <button type="button" class="pw-toggle" aria-label="Mostrar contraseña" onclick="togglePw(this,'newPw2')"><i class="fa-solid fa-eye"></i></button>
            </div>
          </div>
          <button type="button" class="login-btn" id="savePwBtn" onclick="saveNewPassword()">
            <i class="fa-solid fa-key"></i> Cambiar contraseña
          </button>
        </div>

        <!-- Mensajes del flujo telefono -->
        <div class="form-error" id="phoneError" style="display:none;margin-top:14px">
          <i class="fa-solid fa-circle-exclamation"></i>
          <span id="phoneErrorMsg"></span>
        </div>
        <div id="phoneSuccess" style="display:none;background:#eaf5ee;border-left:3px solid #1a5c2e;padding:14px;border-radius:8px;color:#0d3d1a;font-size:15.5px;margin-top:14px"></div>
      </div>

      <div style="text-align:center;margin-top:18px">
        <a href="login.html" style="color:var(--gray-500);font-size:14.5px">
          <i class="fa-solid fa-arrow-left"></i> Volver a iniciar sesión
        </a>
      </div>
    </div>
  </div>
</div>

<script>
let CHANNEL = 'sms';
let RESET_TOKEN = '';

// Solo se ofrece la recuperación por mensaje si hay un proveedor de SMS /
// WhatsApp conectado. Sin él, la pestaña se oculta y queda solo el correo.
fetch('/api/auth/otp-options').then(r => r.json()).then(opts => {
  if (!opts.sms && !opts.whatsapp) {
    document.getElementById('tabPhone').style.display = 'none';
    document.querySelector('.login-header p').textContent = 'Te enviaremos un enlace a tu correo';
    return;
  }
  if (!opts.sms) { document.getElementById('chSms').style.display = 'none'; pickChannel('whatsapp'); }
  if (!opts.whatsapp) document.getElementById('chWa').style.display = 'none';
}).catch(() => { document.getElementById('tabPhone').style.display = 'none'; });

function togglePw(btn, inputId) {
  const input = document.getElementById(inputId);
  const icon  = btn.querySelector('i');
  const show  = input.type === 'password';
  input.type  = show ? 'text' : 'password';
  icon.className = show ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye';
  btn.setAttribute('aria-label', show ? 'Ocultar contraseña' : 'Mostrar contraseña');
}

function switchMethod(m) {
  const email = m === 'email';
  document.getElementById('tabEmail').classList.toggle('active', email);
  document.getElementById('tabPhone').classList.toggle('active', !email);
  document.getElementById('forgotForm').style.display = email ? 'block' : 'none';
  document.getElementById('phoneFlow').style.display = email ? 'none' : 'block';
}

function pickChannel(c) {
  CHANNEL = c;
  document.getElementById('chSms').classList.toggle('active', c === 'sms');
  document.getElementById('chWa').classList.toggle('active', c === 'whatsapp');
}

function showPhoneError(msg) {
  const e = document.getElementById('phoneError');
  e.style.display = 'flex';
  document.getElementById('phoneErrorMsg').textContent = msg;
}
function clearPhoneMsgs() {
  document.getElementById('phoneError').style.display = 'none';
  document.getElementById('phoneSuccess').style.display = 'none';
}

// ===== Metodo correo (igual que antes) =====
async function handleForgot(e) {
  e.preventDefault();
  const email  = document.getElementById('email').value.trim();
  const errBox = document.getElementById('forgotError');
  const okBox  = document.getElementById('forgotSuccess');
  const btn    = document.getElementById('forgotSubmit');
  errBox.style.display = 'none'; okBox.style.display = 'none';
  if (!email) { errBox.style.display = 'flex'; document.getElementById('forgotErrorMsg').textContent = 'Escribe tu correo'; return; }
  btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Enviando...';
  try {
    const r = await fetch('/api/auth/forgot-password', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email }),
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Error');
    okBox.style.display = 'block';
    okBox.innerHTML = '<i class="fa-solid fa-circle-check"></i> ' + (data.message || 'Si el correo está registrado, recibirás un enlace para restablecer tu contraseña en los próximos minutos.');
    document.getElementById('email').value = '';
  } catch (err) {
    errBox.style.display = 'flex';
    document.getElementById('forgotErrorMsg').textContent = err.message;
  } finally {
    btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Enviar enlace';
  }
}

// ===== Metodo SMS / WhatsApp =====
async function sendOtp(isResend) {
  clearPhoneMsgs();
  const phone = document.getElementById('phone').value.trim();
  if (!phone) { showPhoneError('Escribe tu número de teléfono'); return; }
  const btn = document.getElementById(isResend ? 'resendBtn' : 'sendOtpBtn');
  const orig = btn.innerHTML;
  btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Enviando...';
  try {
    const r = await fetch('/api/auth/send-otp', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ phone, channel: CHANNEL }),
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Error');

    // Mostrar paso de codigo
    document.getElementById('stepPhone').style.display = 'none';
    document.getElementById('stepCode').style.display = 'block';
    document.getElementById('codeTarget').textContent = (CHANNEL === 'whatsapp' ? 'WhatsApp ' : 'SMS ') + phone;

    const demoBox = document.getElementById('demoBox');
    if (data.demo && data.devCode) {
      demoBox.style.display = 'block';
      demoBox.innerHTML = '<i class="fa-solid fa-flask"></i> <strong>Modo demo (solo local):</strong> aún no hay proveedor de mensajería conectado, así que tu código es <strong style="font-size:16px">' + String(data.devCode).replace(/\D/g, '') + '</strong>';
    } else {
      demoBox.style.display = 'none';
    }
    document.querySelectorAll('#otpInputs input').forEach(i => i.value = '');
    document.querySelector('#otpInputs input').focus();
  } catch (err) {
    showPhoneError(err.message);
  } finally {
    btn.disabled = false; btn.innerHTML = orig;
  }
}

function readCode() {
  return Array.from(document.querySelectorAll('#otpInputs input')).map(i => i.value).join('');
}

async function verifyOtp() {
  clearPhoneMsgs();
  const phone = document.getElementById('phone').value.trim();
  const code  = readCode();
  if (code.length !== 6) { showPhoneError('Escribe los 6 dígitos del código'); return; }
  const btn = document.getElementById('verifyBtn');
  btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Verificando...';
  try {
    const r = await fetch('/api/auth/verify-otp', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ phone, code }),
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Error');
    RESET_TOKEN = data.resetToken;
    document.getElementById('stepCode').style.display = 'none';
    document.getElementById('stepNewPw').style.display = 'block';
    document.getElementById('newPw').focus();
  } catch (err) {
    showPhoneError(err.message);
  } finally {
    btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-circle-check"></i> Verificar código';
  }
}

async function saveNewPassword() {
  clearPhoneMsgs();
  const p1 = document.getElementById('newPw').value;
  const p2 = document.getElementById('newPw2').value;
  if (p1.length < 8) { showPhoneError('La contraseña debe tener al menos 8 caracteres'); return; }
  if (p1 !== p2)     { showPhoneError('Las contraseñas no coinciden'); return; }
  const btn = document.getElementById('savePwBtn');
  btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Guardando...';
  try {
    const r = await fetch('/api/auth/reset-password', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: RESET_TOKEN, password: p1 }),
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Error');
    document.getElementById('stepNewPw').style.display = 'none';
    const ok = document.getElementById('phoneSuccess');
    ok.style.display = 'block';
    ok.innerHTML = '<i class="fa-solid fa-circle-check"></i> ¡Contraseña actualizada! Te llevamos a iniciar sesión...';
    setTimeout(() => { location.href = 'login.html'; }, 2000);
  } catch (err) {
    showPhoneError(err.message);
  } finally {
    btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-key"></i> Cambiar contraseña';
  }
}

function backToPhone() {
  clearPhoneMsgs();
  document.getElementById('stepCode').style.display = 'none';
  document.getElementById('stepPhone').style.display = 'block';
}

// UX: mover el foco entre los 6 cuadritos del codigo
document.querySelectorAll('#otpInputs input').forEach((inp, idx, all) => {
  inp.addEventListener('input', () => {
    inp.value = inp.value.replace(/\D/g, '');
    if (inp.value && idx < all.length - 1) all[idx + 1].focus();
  });
  inp.addEventListener('keydown', e => {
    if (e.key === 'Backspace' && !inp.value && idx > 0) all[idx - 1].focus();
  });
  inp.addEventListener('paste', e => {
    e.preventDefault();
    const digits = (e.clipboardData.getData('text') || '').replace(/\D/g, '').slice(0, 6).split('');
    digits.forEach((d, i) => { if (all[i]) all[i].value = d; });
    if (digits.length) all[Math.min(digits.length, all.length - 1)].focus();
  });
});
</script>
</body>
</html>
